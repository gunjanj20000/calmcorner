<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A0C4E2"/>
      <stop offset="50%" stop-color="#C8B6FF"/>
      <stop offset="100%" stop-color="#98D7C2"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Soft rounded background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" />
  
  <!-- Calming glowing lotus / bubble sparkles -->
  <g filter="url(#softGlow)" fill="#FFFFFF" fill-opacity="0.95">
    <!-- Center petal -->
    <path d="M256 120 C230 180 200 240 200 300 C200 340 225 365 256 365 C287 365 312 340 312 300 C312 240 282 180 256 120 Z" />
    <!-- Left petal -->
    <path d="M236 210 C180 240 140 270 140 310 C140 345 168 365 204 365 C240 365 250 330 246 295 C242 260 236 210 236 210 Z" opacity="0.85" />
    <!-- Right petal -->
    <path d="M276 210 C332 240 372 270 372 310 C372 345 344 365 308 365 C272 365 262 330 266 295 C270 260 276 210 276 210 Z" opacity="0.85" />
    <!-- Bottom gentle ripple -->
    <path d="M160 395 C210 405 302 405 352 395 C360 394 360 405 350 408 C295 418 217 418 162 408 C152 405 152 394 160 395 Z" opacity="0.7" />
    <!-- Floating tiny stars / bubbles -->
    <circle cx="160" cy="160" r="14" opacity="0.8" />
    <circle cx="350" cy="180" r="18" opacity="0.8" />
    <circle cx="330" cy="130" r="9" opacity="0.6" />
  </g>
</svg>
